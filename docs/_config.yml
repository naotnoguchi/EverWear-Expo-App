# GitHub Pages設定 - EverWear利用規約・プライバシーポリシー
# termsとprivacyページからルートに戻れないよう設定

# サイトの基本設定
title: ""
description: ""
show_downloads: false

# ナビゲーション制御 - ルートへのリンクを完全に無効化
header_pages: []
navigation: []

# テーマ設定
theme: minima
minima:
  skin: classic
  social_links: []
  
# ヘッダーとフッターをシンプルに
header_content: ""
footer_content: ""

# GitHub Pages設定
plugins:
  - jekyll-feed
  - jekyll-sitemap

# SEO設定（利用規約・プライバシーポリシーページ用）
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      show_title: true
      
# 検索エンジン向け設定
lang: ja
locale: ja_JP

# サイトマップから除外（必要に応じて）
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 利用規約・プライバシーポリシー特有の設定
# ページ間のナビゲーションも最小限に
show_excerpts: false
paginate: false